name: cleancruisers_app
description: CleanCruisers - Doorstep Car Wash & Detailing App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
