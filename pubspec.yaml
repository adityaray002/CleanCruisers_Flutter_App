name: cleancruisers_app
description: CleanCruisers - Doorstep Car Wash & Detailing App
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Kept: Flutter's built-in Cupertino widgets reference these icons. Unused
  # glyphs are tree-shaken out of release builds, so it costs almost nothing.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  # Generator only (dart run flutter_native_splash:create); not needed at runtime.
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F10"
  adaptive_icon_foreground: "assets/images/logo.png"

# Source images live in design/splash (not bundled into the app). Regenerate
# with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: design/splash/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: design/splash/splash_android12.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/
